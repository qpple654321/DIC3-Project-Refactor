schema: spec-driven
context: |
  Project: Moto Touring Copilot, Taiwan motorcycle itinerary feasibility.
  Status: Proposal only. Original DESIGN.md remains authoritative.
  Scope: L2, five specialized agents, tool-grounded P50/P90, five deterministic rules, bounded replanning.
  Out of scope: L3 live MQTT telemetry and voice warnings.
  Never commit untrimmed raw GPX, secrets, or invented benchmark results.
rules:
  proposal:
    - Specify measurable goals, constraints and planned deliverables.
  specs:
    - State normative requirements with SHALL/MUST and Given/When/Then scenarios.
  tasks:
    - Keep unfinished implementation and verification tasks unchecked.
